name: Build ZiaAI Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar ZiaAI.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK Android (assembleDebug)
        working-directory: android-companion
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Preparar arquivo ZiaAI.apk
        run: |
          cp android-companion/app/build/outputs/apk/debug/app-debug.apk ZiaAI.apk
          ls -lh ZiaAI.apk

      - name: Publicar Artifact ZiaAI.apk
        uses: actions/upload-artifact@v4
        with:
          name: ZiaAI-APK
          path: ZiaAI.apk
          if-no-files-found: error
          retention-days: 30
